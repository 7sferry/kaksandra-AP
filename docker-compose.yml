version: '3.8'

services:
  cassandra1:
    image: cassandra:4.1
    container_name: cass1
    environment:
      CASSANDRA_CLUSTER_NAME: test-cluster
      CASSANDRA_SEEDS: cass1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: r1
      CASSANDRA_LISTEN_ADDRESS: cass1
      CASSANDRA_BROADCAST_ADDRESS: cass1
      CASSANDRA_RPC_ADDRESS: 0.0.0.0
      CASSANDRA_BROADCAST_RPC_ADDRESS: cass1
    ports:
      - "9042:9042"
    networks:
      - cassnet
    volumes:
      - cass1:/var/lib/cassandra

  cassandra2:
    image: cassandra:4.1
    container_name: cass2
    depends_on:
      - cassandra1
    environment:
      CASSANDRA_CLUSTER_NAME: test-cluster
      CASSANDRA_SEEDS: cass1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: r1
      CASSANDRA_LISTEN_ADDRESS: cass2
      CASSANDRA_BROADCAST_ADDRESS: cass2
      CASSANDRA_RPC_ADDRESS: 0.0.0.0
      CASSANDRA_BROADCAST_RPC_ADDRESS: cass2
    ports:
      - "9142:9042"
    networks:
      - cassnet
    volumes:
      - cass2:/var/lib/cassandra

  cassandra3:
    image: cassandra:4.1
    container_name: cass3
    depends_on:
      - cassandra1
    environment:
      CASSANDRA_CLUSTER_NAME: test-cluster
      CASSANDRA_SEEDS: cass1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: r1
      CASSANDRA_LISTEN_ADDRESS: cass3
      CASSANDRA_BROADCAST_ADDRESS: cass3
      CASSANDRA_RPC_ADDRESS: 0.0.0.0
      CASSANDRA_BROADCAST_RPC_ADDRESS: cass3
    ports:
      - "9242:9042"
    networks:
      - cassnet
    volumes:
      - cass3:/var/lib/cassandra

networks:
  cassnet:

volumes:
  cass1:
  cass2:
  cass3:
